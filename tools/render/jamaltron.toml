# Jamaltron art-iteration knobs (PLAN C.10).
#
# ONE-LINE DIFFS ONLY. Everything that changes what a rendered frame looks like is in
# this file. If you find yourself opening a .py to change how the shark looks, that is
# a bug in the harness -- file it, do not work around it.
#
# Every key here exists in render/artconfig.py's SCHEMA and a key that does NOT exist
# there is a hard error, not a no-op. `default N` in a comment is the schema's value,
# not necessarily the value on the line below it -- that is the whole point of writing
# both down.
#
# Run it:
#   uv run --directory tools python render/art.py --preview      # 8 rotations, seconds
#   uv run --directory tools python render/art.py --compare      # THE image to look at
#   uv run --directory tools python render/art.py --full         # the real 64
#   uv run --directory tools python render/art.py --shadow       # shadow-only pass
#   ... --set model.scale=0.85 --set model.offset='[0,0,1.4]'    # try before you commit
#
# Outputs land in render-out/ (gitignored). Every one carries the hash of the config
# that produced it, plus a sidecar JSON of the fully resolved knobs.

[model]
# TUNED BY HAND in render/tune.py on 2026-09-20 -> config 137972136a75, which was
# 335119bf9c46 by the time C.4 shipped sheets and is 83d6be794998 now.
# THE SHARK KNOBS BELOW HAVE NOT MOVED SINCE THE TUNE. Both older hashes were taken over
# the model's PATH, so they were facts about one laptop -- three copies of one .blend gave
# three hashes for identical pixels. The hash is over the model's CONTENT now (see
# artconfig.hashable), so 83d6be794998 is what these knobs come out as on any machine
# holding the same file. The part of the jump that is a real knob change is the [mask]
# plate and the [compare] cell, both of which moved in the same pass; pivot, scale, girth
# and offset are untouched.
# pivot sits well FORWARD of the dorsal peak (-0.53), near the cephalofoil, so he swings
# from the head with the tail trailing rather than spinning about his middle. girth 1.55 is
# the "overweight" canon doing real work. offset 0.5 sits him lower than the measured 0.85.
# The bought hammerhead. GITIGNORED and it stays that way -- the RenderHub Extended Use
# License turns on renders shipping and source not. Relative paths resolve from the repo
# root; $JAMALTRON_BLEND or --blend overrides, which is how you point at a copy that
# lives outside the repo (the C.2 triage unpack, say).
# default "assets/source/FILES/HAMMERHEAD.blend"
blend = "assets/source/FILES/HAMMERHEAD.blend"

# The object that gets rotated. C.2: one mesh HAMMERHEAD parented to armature
# HAMMERHEAD_RIG, so rotating the rig takes the mesh with it.
# default "HAMMERHEAD_RIG"
object = "HAMMERHEAD_RIG"

# THE RE-PIVOT, and it is not optional. C.2 measured the model's origin sitting 1.0746 BU
# toward the nose and 0.387 BU below body centre, so rotating about it SWEEPS the tail
# through a 3.59 BU circle instead of spinning in place. This is the rest-pose geometric
# centre; the harness translates the model by -pivot so frame-to-frame rotation is a spin.
# Visual tell if it is wrong: the shark orbits the sprite's centre across the 64 frames.
# default [-1.0746, 0.0, 0.3872]
pivot = [-0.14, 0.0, 0.3872]

# Multiplier on Blender units. The model is metric, 1 BU = 1 m = 1 Factorio tile, and the
# rest-pose box is 5.0272 x 1.9682 x 1.8771 BU, so scale 0.75 gives a 3.77 x 1.48 tile
# shark. For reference the stock spidertron torso is a near-circular 2.06 x 2.06 tiles and
# the leg mounts sit at +-0.78 tiles transverse: half-width 1.9682/2 * scale must reach
# 0.78 for the body to cover the outer mounts, which wants scale 0.79 and a 4-tile shark.
# Note how Wube dodges this: the mounts do NOT land on the rotating torso (230 of its 512
# mount samples are over transparent pixels) but on base_animation, a 1.97 x 1.66 tile
# under-plate that never turns. We ship no plate, so either the shark covers the mounts
# himself or C.4 draws one. THAT TRADEOFF IS C.4's CALL. Look at --compare, not at this
# number -- the STOCK row draws the plate, so the sheet shows you both options at once.
# default 0.75
scale = 0.81

# WIDTH-ONLY multiplier on top of `scale`, applied to the model's y axis. 1.0 is the
# model as sculpted; 1.3 is noticeably heavier without adding a single tile of length.
# This is the "overweight" knob and it is CANON, not a cheat: the profile has him
# "17 feet long, described as overweight and oversized", so a uniform scale-up makes
# him LONGER, which is the one thing the books never say. It is also the only knob that
# improves leg coverage without making him enormous - the legs mount at +-0.78 tiles
# transverse, and his half-width is 0.984 * scale * girth, so girth buys coverage at
# roughly four times the length cost of scale.
# default 1.0
girth = 1.55

# (east, north, up) in TILES, applied after scale. Up is the one that matters, and 0.85 is
# MEASURED, not the obvious number. The spidertron prototype declares height = 1.5, but
# that is the leg/aim height and NOT where the torso is drawn: the shipped torso sprite's
# own shift is by_pixel(0, -19) = 0.594 tiles up-screen, and a 45-degree camera turns
# 0.594 tiles of screen into 0.594/0.7071 = 0.84 tiles of world height. Setting 1.5 here
# floats the shark a third of a body above his own legs -- which --compare shows you
# immediately, and which is how this number got fixed in the first place.
# Raise it and he floats; lower it and the legs grow out of his back.
# default [0.0, 0.0, 0.85]
offset = [0.0, 0.0, 0.5]

# Extra (roll about east, PITCH about north, yaw) in degrees, on top of base_yaw. Pitch is
# the nose-up/nose-down knob -- a few degrees of nose-up reads as "swimming" rather than
# "dead fish on a stick", and the jump arc in C.5 wants much more of it.
# default [0.0, 0.0, 0.0]
rotation = [0.0, 0.0, 0.0]

# The model's nose points +x (C.2) and Factorio's frame 0 faces north (+y), so the rest
# pose needs a quarter turn before the per-frame rotation is applied. Change this only if
# the model changes; use `rotation` for art tweaks.
# default 90.0
base_yaw = 90.0

# C.2 REQUIRED FIX: five NLA tracks ship unmuted (SWIM_FAST, SWIM_SLOW, SWIM_MEDIUM,
# BITE_02, BITE_01) and BITE_01 blends COMBINE on top of the rest, so an un-muted render
# is a shark caught mid-bite mid-swim. Mute them and the torso sheet is a clean body.
# default true
mute_nla = true

# Clear every pose bone to rest after muting. Muting alone leaves whatever pose was saved
# in the file; the rest pose is the straight shark, and it is the pose `pivot` was measured
# against, so turning this off invalidates the pivot too.
# default true
rest_pose = true

# C.2 REQUIRED FIX: every clip carries a stale final keyframe duplicating the loop start
# (SWIM_FAST spans frames 1..21 for a 20-frame cycle). Harmless for a static torso render,
# fatal for C.5's flop loop, which would hold one frame twice. Fixed here so both passes
# see the same corrected actions.
# default true
drop_stale_keyframes = true

# Scene frame to sit on. Only matters with rest_pose = false or once C.5 animates.
# default 1
frame = 1

# Subdivision modifier render levels. The model ships at 2 (41k faces, 82k tris); 1 is
# 10k faces and at 132 px the difference is invisible while the cost is not. 0 turns the
# subdivision off entirely and the silhouette goes faceted.
# default 1
subdiv_render_levels = 1

[camera]
# Camera elevation in degrees. 45 IS NOT A PREFERENCE: core/lualib/math3d.lua ships
# projection_constant = 1/sqrt(2) and projects (y+z)*k with ONE constant for both ground
# depth and height, which is only true at the unique elevation where sin == cos. Changing
# this desyncs the sprite from every other entity in the game; the harness warns loudly.
# default 45.0
pitch = 45.0

# Factorio sprite scale the sheet will declare. 0.5 is what every stock sprite uses and it
# means 64 source px per tile east-west (45.25 px north-south and for height).
# default 0.5
sprite_scale = 0.5

# Square render canvas for the BODY pass, in tiles. Must hold the shark at `scale` AND the
# up-screen lift from `model.offset`: a 4.07-tile shark pointing north projects
# 4.07 * 0.7071 = 2.88 tiles tall, and the 0.5-tile height offset lifts him another
# 0.5 * 0.7071 = 0.35 tiles. MEASURED on the shipped knobs, union of all 64 rotations'
# alpha at >= 8/255: he fills 5.59 x 4.48 tiles of the 6, reaching 2.68 tiles above the
# entity origin and 1.81 below -- 0.31 tiles of headroom at the top, 0.20 at each side.
# The SIDE is the tight edge, not the top: broadside he is 4.07 tiles of pure length while
# the 45-degree camera flattens his height by 0.71, so width wins. It runs out at scale
# 0.87 -- MEASURED by rendering frames 16 and 48, which are the widest two: 0.86 is clean,
# 0.87 trips the warning. The shipped 0.81 is 7% off the edge, not the comfortable margin
# the pre-C.13 numbers here used to claim. Too small clips the nose; too large is wasted pixels and
# slower frames. art.py re-measures this on every render, cached frames included, and
# shouts (`WARN body pass: ... TOUCH THE CANVAS EDGE`) rather than trusting this comment.
# default 6.0
canvas_tiles = 6.0

# Same, for the SHADOW pass, which needs much more canvas: a 45-degree sun runs the shadow
# one tile EAST per tile of height, so a shark whose top is 2.2 tiles up throws its shadow
# 2.2 tiles east of itself. 11 tiles holds a 4-tile shark plus its full smear. Stock does
# the same thing -- its shadow frame is 192 px wide against a 132 px body.
# default 11.0
shadow_canvas_tiles = 11.0

[sun]
# Compass bearing the shadow RUNS toward, degrees. 90 = due east, i.e. the sun sits due
# west. Measured five independent ways off the shipped art in factorio_camera.py; the
# spidertron's own shadow sheet predicts its west edge to 0.6 px at this value.
# default 90.0
azimuth = 90.0

# Sun elevation, degrees. 45 again, and for the same reason -- a point at height h drops
# its shadow exactly h tiles along the azimuth. Lower it and shadows stretch past what
# neighbouring stock entities do.
# default 45.0
elevation = 45.0

# Blender sun strength. MEASURED against this model, not guessed: his albedo is a dark
# grey-blue, so at 3 he renders near-black and at 30 the cephalofoil blows out. 16 reads
# as a shark at Factorio's zoom while keeping the dorsal highlight intact.
# default 16.0
energy = 16.0

# Sun angular diameter in degrees. 0 is a razor-sharp shadow edge, which looks synthetic;
# stock shadows have a soft fringe. 1.0 is roughly the real sun. Bigger = blurrier edge
# and, in Cycles, noisier at the same sample count.
# default 1.0
angular_size = 1.0

# World background strength: flat ambient fill, and the cheapest fill light there is --
# no second lamp, no extra shadow. Under ~0.1 the sun-away flank goes to a black hole;
# past ~0.5 it flattens the whole body out. 0.25 keeps the form and opens the shadows.
# default 0.25
ambient = 0.25

[render]
# BODY pass engine. MEASURED, not assumed: EEVEE Next and Cycles CPU cost about the same
# wall time at sprite resolution on this machine, but Cycles spends 4x the CPU to get there
# and its output is noisy at low samples, while EEVEE's is clean. The model's Cycles-only
# features (subsurface weight 1.0, a 4096 normal map) are invisible at 132 px anyway --
# which is exactly why `use_subsurface` defaults off. Flip to "CYCLES" for a final sheet.
# default "BLENDER_EEVEE_NEXT"
engine = "BLENDER_EEVEE_NEXT"

# SHADOW pass engine. Do not change it. Only Cycles honours object.is_shadow_catcher;
# EEVEE Next accepts the attribute and then renders the catcher plane fully opaque, so the
# shadow pass silently comes back as a grey square.
# default "CYCLES"
shadow_engine = "CYCLES"

# Cycles device. A 384 px tile is pure launch overhead for a GPU -- Metal costs a 39 s
# one-time kernel compile and then MORE per frame than CPU. "GPU" exists for when the
# canvas grows.
# default "CPU"
device = "CPU"

# Samples for a --full sheet. EEVEE reads this as TAA samples (cheap, just antialiasing);
# Cycles reads it as paths per pixel (expensive, and the knob that trades noise for time).
# default 64
samples = 64

# Samples for --preview and --compare. The whole point of preview is the loop time, and at
# 16 EEVEE is already clean. Raise it only if you are judging noise rather than shape.
# default 16
preview_samples = 16

# Samples for the shadow pass. Cycles, and a shadow-catcher alpha is a much easier integral
# than a lit surface, so 32 is plenty. Under ~16 the soft edge goes blotchy.
# default 32
shadow_samples = 32

# Render at N x resolution and Lanczos-downsample to the final size. 1 uses Blender's own
# filter. 2 is the knob to reach for if the silhouette edges look ragged in the final sheet
# -- it costs 4x the pixels, so leave it at 1 while iterating. It multiplies the RENDER
# size only: the frame on disk, and every provenance stamp on it, is the final size.
# default 1
supersample = 1

# Hard override of the FINAL body resolution in px. 0 = derive it (canvas_tiles * 64),
# which keeps one tile at exactly 64 source px and the packer's shift math exact. The shadow
# canvas rides whatever you set here, so both passes stay at one px-per-tile and --compare
# can still overlay them: 384 here means a 384 px body and a 704 px shadow. `supersample`
# still applies on top -- 384 with supersample 2 renders 768 and downsamples to 384 -- so
# the stamped resolution is always the size of the file beside it. Changing this changes
# BOTH passes' cache keys, including the shadow's. Deliberately-wrong-scale proofs only.
# default 0
resolution_px = 0

# Colour management. Factorio art is plain sRGB. Blender 4.x defaults to AgX, which crushes
# highlights and desaturates -- the shark comes out looking washed next to a stock sprite.
# "Standard" is the only value that matches the game.
# default "Standard"
view_transform = "Standard"

# Creative look on top of the view transform. "None" for anything that has to match stock.
# default "None"
look = "None"

# The model ships Subsurface Weight 1.0 (C.2). It is a Cycles feature, it costs real time,
# and at 132 px on a dark-skinned shark it is invisible. Off by default; turn it on only to
# confirm for yourself that it does nothing at this size.
# default false
use_subsurface = false

# The 4096x4096 normal map at strength 0.4. Same argument as subsurface -- at 132 px the
# detail is far below a pixel -- but unlike subsurface it is nearly free, and it does still
# shape the broad dorsal/flank shading. Left on.
# default true
use_normal_map = true

# Normal map strength, as authored. Raise to exaggerate the surface relief (gill slits,
# flank creases) if you decide the sprite reads too smooth at Factorio's zoom.
# default 0.4
normal_strength = 0.4

[rotations]
# Directions in the full sheet. Factorio's spidertron torso uses 64 and so must we -- the
# entity's rotation is quantised to this and 32 reads as visibly steppy while panning.
# default 64
count = 64

# Directions in --preview and, by default, --compare. Must DIVIDE count, so preview frames
# are a subset of the full wheel at identical angles and the cache shares work between the
# two. 8 gives N, NE, E, SE, S, SW, W, NW.
# default 8
preview = 8

# Frame index direction. Factorio counts frame 0 = north then CLOCKWISE unless the
# prototype sets counterclockwise = true. The stock torso does not, so neither do we.
# default false
counterclockwise = false

[compare]
# Columns in the compare sheet -- how many rotations to put side by side. 8 fits a readable
# 2048 px wide PNG; 16 needs a lot of scrolling for not much more information.
# default 8
rotations = 8

# Size of one compare cell in TILES, square. Sets how much context sits around the shark,
# and getting it wrong is not cosmetic: a cell smaller than the sprite CROPS the sprite,
# and this sheet is where scale, pivot and offset get decided. 4.6 was measured against a
# shark that was re-tuned afterwards and never re-measured -- against the shipped knobs it
# was a 294 px cell over a 358 px union, cutting 32 px off each side at E/W and 50 px off
# the bottom at every rotation, tail flat-sliced at 16 and 48, head at 32.
# 6.0 is `camera.canvas_tiles`: the cell IS the render canvas, so it cannot crop anything
# the render did not already crop, and the render pass has warned about its own canvas
# since C.10. --compare now measures every cell against the frame it came from and puts
# the verdict on stdout and in the footer whichever way it goes, so the next knob change
# shouts instead of quietly slicing him.
# default 6.0
cell_tiles = 6.0

# Where the entity origin (the point on the GROUND the legs stand around) sits inside a
# cell, as a fraction of cell height. Not decoration: model.offset lifts the shark 0.5
# tiles of world height, which a 45-degree camera turns into 0.35 tiles up-screen, so he
# sits high in his own canvas and a cell centred on the origin wastes its bottom half.
# MEASURED over all 64 rotations he reaches 2.68 tiles above the origin against 1.81
# below, and 0.60 is that split (2.68 / 4.48) -- the cell is spent where he actually is.
# 0.78 was STOCK's bias (the spidertron torso is 138 px tall with the entity at pixel 106,
# 77% down) rather than a measurement of ours, and paired with a 4.6-tile cell it is what
# put 50 px of tail off the bottom of every frame. Move it and --compare tells you what
# the cell can still hold.
# default 0.60
origin_y = 0.60

# Cell background, RGB. Mid-slate on purpose: a transparent checkerboard makes the shadow
# unjudgeable and pure black hides the shark's own dark underside.
# default [58, 62, 66]
background = [58, 62, 66]

# Opacity of the stock spidertron ghost in the OVERLAY row. 0.45 is enough to see where the
# stock torso ends without fighting the shark for attention.
# default 0.45
stock_alpha = 0.45

# Draw the STOCK row at all. Off makes a jamaltron-only contact sheet.
# default true
show_stock = true

# Composite the shadow pass under the body in the compare sheet. Needs shadow frames; the
# harness renders them if they are missing (Cycles, so this is the slow half of --compare).
# default true
show_shadow = true

# Draw the eight leg MOUNT POINTS as markers. This is the question C.4 has to answer: stock
# declares mount_position by_pixel(+-15,-22) (+-23,-10) (+-25,+4) (+-15,+17), i.e. +-0.78
# tiles transverse, and a mount that falls off the shark's silhouette is a leg growing out
# of thin air. Leave these on.
# default true
show_mounts = true

# Draw each mount's leg as a line down to its declared ground_position, so you can see the
# stance and not just the attachment points.
# default true
show_legs = true

# One-tile grid overlay on each cell, so you can read sizes off the image directly.
# default true
grid = true

[mask]
# THE RUNTIME-TINT MASK (C.4b). Stock ships spidertron-body-mask.png -- 130x100, 64
# directions, apply_runtime_tint -- and WITHOUT a mask layer the entity colour picker does
# nothing at all, which also makes D.4's careful preservation of `color` across the beached
# swap dead code. So the question is not whether to ship one, it is WHAT to tint.
#
# Stock's answer does not transfer. Its mask is a shaded greyscale copy of the ENTIRE
# torso at alpha 224, so the player's colour becomes the machine. Do that to a hammerhead
# and he stops being a shark and starts being a 4-tile lozenge in team colours.
#
# So: tint the HARNESS, the same reasoning C.13 settled the mounts with. He is strapped
# into his legs, the straps are the man-made part of him, and a man-made part is the only
# thing on this model that has any business being whatever colour the player likes. The
# mask pass renders one flat grey shader whose ALPHA is a band function of the model's own
# local coordinates, so the tinted region is a saddle and two girth straps rather than a
# whole fish. It is also additive content: the model has no harness, and this layer draws
# one.
#
# HONEST LIMIT, because the config file is where it belongs: this paints the harness ON
# his skin. There is no geometry, so it has no raised silhouette and no self-shadow -- it
# reads as webbing, not as a buckled strap. Second limit, learned the hard way: the band is
# a function of coordinates and NOTHING ELSE, so it cannot tell his back from his dorsal
# fin. It is kept off the fin by a z ceiling (`plate_top_z`), measured against this model,
# and moving the model or the straps means re-checking it -- render the mask pass and look
# at it over the body. F.2's in-game eyeball is the real check for both.
#
# "harness" is the shipped mode. "silhouette" is stock's approach, kept so disagreeing is
# a one-line diff rather than a rewrite; the harness warns you about it if you pick it.
# default "harness"
mode = "harness"

# Forward strap centre, in MODEL-LOCAL BU along the length axis (+x is the nose). The
# rest-pose mesh spans x -3.588 (caudal fin) to +1.439 (cephalofoil) and the tuned pivot
# sits at -0.14, so the eight leg mounts -- +-0.352 tiles of screen offset, i.e. +-0.43 BU
# at scale 0.81 -- cluster in x -0.57..+0.29. The straps bracket that cluster: the load
# goes into the straps, not into the middle of a plate.
# default 0.2
strap_fore = 0.20

# Aft strap centre, same units. Sits behind the pectoral fin roots (FIN_LEFT/FIN_RIGHT
# head at x -0.075) so the strap does not cut across a fin.
# default -0.62
strap_aft = -0.62

# Strap width in BU, measured along the length axis. 0.16 BU is 0.13 tiles is about 8 px
# in the packed sheet -- thin enough to read as a strap, thick enough to survive Factorio's
# own sprite compression.
# default 0.16
strap_width = 0.16

# Local z the dorsal PLATE starts at: the saddle's lower edge, i.e. how far down his
# flanks the harness wraps. Between the straps his BODY runs from about z -0.3 (belly) to
# 0.75 (the crest, where the fin takes over), so this is the useful range: -0.3 wraps the
# plate all the way under him and duplicates what the straps already do, 0.6 leaves a thin
# ribbon along his spine. 0.24 sits just above the mid-flank -- from the side it reads as
# a saddle pad between the two straps, from above it meets both of them.
# default 0.24
plate_z = 0.24

# Local z the plate STOPS at, and this is the knob that keeps the player's colour off his
# dorsal fin. Without a ceiling the plate is "everything between the straps ABOVE plate_z"
# and the tallest thing between the straps is the fin, which rises to z 1.44: the first
# shipped mask tinted it base to tip, so the entity colour picker painted a shark fin and
# the block above claiming this tints the HARNESS was simply not true of the pixels. Worse,
# the documented escape hatch ran backwards -- raising plate_z removed the saddle and kept
# the fin, because at plate_z 0.62 there was no saddle, only fin.
# MEASURED by sweeping the cap and looking at the mask over the body (dir 16, the pure
# side view): the back between the straps carries body up to about z 0.75, and past ~0.8
# the plate starts climbing the blade. 0.70 covers the whole back and stops clear of it;
# below ~0.5 it leaves a bare strip of back between the saddle and the fin. The fin then
# rises through a hole in the saddle, which is what a harness on a shark would do.
# Set this at or below plate_z and the plate is empty -- two bare straps, the harness
# warns you -- which IS the escape hatch the old comment was reaching for.
# default 0.70
plate_top_z = 0.70

# Soft edge on every band, in BU. 0 gives a hard stair-stepped edge at 64 px/tile; 0.04 BU
# is roughly two pixels of ramp, which is what the body pass's own antialiasing looks like.
# default 0.04
edge = 0.04

# Base grey of the mask surface, LINEAR -- so it is not the number that lands in the PNG.
# Factorio MULTIPLIES the sprite by the entity colour, so this sets how bright the tinted
# harness reads against him. MEASURED on the shipped lighting, mean over the band's own
# opaque pixels on frame 16 (due east): 0.10 -> 123, 0.12 -> 133, 0.14 -> 142, 0.20 -> 166,
# 0.62 -> 227 (clipped, a white decal). The shark's own body renders at a mean of 97 on the
# same frame and stock's torso mask sits at 102, so 0.12 puts the harness about a third
# brighter than the hide it is strapped to:
# visible as webbing at a neutral colour, and saturated enough that the colour picker
# obviously did something.
# default 0.12
grey = 0.12

[reflection]
# THE WATER REFLECTION, and it is built by pack.py out of the body frames -- no Blender
# pass, because there is nothing to render. MEASURED off what stock actually ships:
# spidertron-body-water-reflection.png is a 448x448 single frame, variation_count 1,
# rotate/orientation_to_variation both false, shift 0, and every pixel of it is PURE RED
# (255,0,0) with the shape carried entirely in the alpha. It is a soft blurred ellipse
# 194x133 px -- 1.7x the torso sprite's own footprint -- centred on the entity origin. The
# 448 canvas is just Wube not cropping a 5.6 KiB palette PNG; it is not a number to match.
#
# So ours is the same thing derived honestly: the MEAN alpha of all 64 body rotations
# (rotationally symmetric by construction, dense where he always is and faint at the
# extremities he only sometimes reaches), blurred, gained, recentred on the origin, RGB
# forced to pure red, cropped to its own alpha box.

# Blur radius in TILES. This is the whole look: under ~0.1 the blob keeps a shark
# silhouette, which no reflection in moving water has; past ~0.4 it is a featureless
# smudge wider than he is. 0.16 is 10 px at the shipped 64 px/tile.
# default 0.16
blur_tiles = 0.16

# Multiplier on the mean alpha before it clips at 255. The mean of 64 rotations peaks well
# under 255 -- only the ground he covers at EVERY heading is opaque -- so gain is what sets
# how much of the blob is a solid core and how much is falloff. Picked by putting ours
# beside stock's at matched scale: 1.7 leaves a small core in a wide halo, 3.6 is nearly
# all core, 2.6 matches stock's own core-to-halo ratio. Raising it also WIDENS the sheet,
# because the alpha box is measured at a fixed floor and gain lifts the far tails over it.
# default 2.6
gain = 2.6

# Slide the blob so its alpha centroid lands on the entity origin, which is what makes the
# emitted shift ~0 and therefore directly comparable to stock's. Off leaves it where the
# render put it -- up-screen by model.offset's lift -- and the shift comes out non-zero.
# default true
recentre = true

[output]
# Render root, relative to the repo root. GITIGNORED. Sheets are promoted into
# mod/jamaltron/graphics/ deliberately and by hand, never by this tool -- the graphics
# directory carries its own LICENSE carve-out and things landing there is a decision.
# default "render-out"
dir = "render-out"
