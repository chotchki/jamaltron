# Hand-written sections only. Jamal's speech lines are generated from
# character/lines.md by tools/gen_lines.py (PLAN B.5) and land in their own file.
#
# Every name and description below is a PLACEHOLDER. Jamal's actual voice comes out of
# the Phase B profile and lands with D.2 - keep these flat and factual until then.

[mod-name]
jamaltron=Jamaltron

[mod-description]
jamaltron=Adds Jamal, the spider-legged hammerhead shark from Dungeon Crawler Carl, as a spidertron variant.

[entity-name]
jamaltron=Jamaltron
jamaltron-leg=Jamaltron leg
jamaltron-remnants=Jamaltron remnants
jamaltron-beached=Jamaltron (beached)
jamaltron-airborne=Jamaltron (airborne)

[entity-description]
jamaltron=A hammerhead shark bolted onto eight spider legs. Yes, really.
jamaltron-beached=His legs are broken. Repair him to full health to get him walking again.
jamaltron-airborne=Mid-jump.

[item-name]
jamaltron=Jamaltron
jamaltron-flamethrower=Jamaltron flamethrower
# D.7.3: every gun on a beached Jamal is a disarmed twin (prototypes/disarm.lua); __1__ is the
# working gun's own name, so another mod's gun on him reads right too.
jamaltron-broken-gun=__1__ (out of action)

[item-description]
jamaltron=A hammerhead shark bolted onto eight spider legs. Yes, really.
jamaltron-broken-gun=His legs are broken, so it cannot fire. Repair him to full health to use it again - the ammo stays loaded.

[recipe-name]
jamaltron=Jamaltron

[technology-name]
jamaltron=Jamaltron

[technology-description]
jamaltron=Bolt a hammerhead shark onto a spidertron chassis.

[equipment-name]

[custom-input-name]
# E.2.6's key (prototypes/input.lua). MEASURED 2.1.17: a custom-input's default localised name is
# custom-input-name.<name> - the [controls] section older mods use is not where it looks.
jamaltron-jump=Jamaltron: jump

[custom-input-description]
jamaltron-jump=While driving a Jamaltron: jump the way you are steering, or the way he faces when standing still.

[jamaltron-speech]
# D.5's two wrappers. Narration is the GAME describing him and carries chotchki's literal
# "Game Note: " prefix (lines.md: the prefix lives in the renderer, not in the catalog).
narration=Game Note: __1__
chat=Jamal: __1__

[jamaltron-status]
# The entity-GUI status D.4's body table puts on a beached Jamal (scripts/swap.lua, M.BODY).
# Without one the GUI reads the engine's "No fuel": prototypes/bodies.lua immobilises him
# with a burner that has no fuel slot.
beached=Legs broken - repair him to full health

[mod-setting-name]
jamaltron-jump-enabled=Jumping
jamaltron-jump-distance=Jump distance
jamaltron-leg-break-percent=Leg-break chance
jamaltron-jump-cooldown=Jump cooldown
jamaltron-speech-cooldown=Speech cooldown
jamaltron-apology-interval=Apology interval
jamaltron-verbosity=Jamal verbosity
jamaltron-max-bubbles=Speech bubble limit
jamaltron-chat-echo=Jamal in chat

[mod-setting-description]
jamaltron-jump-enabled=Adds the jump keybind while driving a Jamaltron. Off removes jumping, and with it every broken leg.
jamaltron-jump-distance=Tiles covered by one jump.
jamaltron-leg-break-percent=Chance, in percent, that a landing breaks his legs. 0 never, 100 every landing.
jamaltron-jump-cooldown=Seconds after a takeoff before the same Jamaltron can jump again. 0: as soon as he lands.
jamaltron-speech-cooldown=Minimum seconds between his idle chatter, walking commentary, damage complaints and apologies. Boarding, jumps, breaks and his death always get through.
jamaltron-apology-interval=Seconds between apologies while he lies with broken legs.
jamaltron-verbosity=How much he says, for everyone. Quiet keeps only the best lines, Unbearable keeps all of them.
jamaltron-max-bubbles=Most speech bubbles on the map at once - each one costs frame time to draw. At the limit his idle chatter waits; boarding, jumps, breaks and his death still speak, replacing the oldest chatter.
jamaltron-chat-echo=Also print his lines in your chat. The speech bubbles show either way.

[string-mod-setting]
jamaltron-verbosity-quiet=Quiet
jamaltron-verbosity-normal=Normal
jamaltron-verbosity-unbearable=Unbearable
